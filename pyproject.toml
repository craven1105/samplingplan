[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "craven1105-samplingplan"
version = "0.1.0"
description = "对照任务类型列出温度、长度等参数的取值区间与取舍依据。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "craven1105" }]
keywords = ["sampling", "parameters", "llm", "guide"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://craven1105.github.io"
Repository = "https://github.com/craven1105/samplingplan"
Issues = "https://github.com/craven1105/samplingplan/issues"

[project.scripts]
samplingplan = "samplingplan:main"

[tool.setuptools]
py-modules = ["samplingplan"]
